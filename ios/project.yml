name: PrintPulse
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRINTPULSE_BUNDLE_ID: com.tnichol00.PrintPulse
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
packages:
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT.git
    exactVersion: 2.4.1
targets:
  PrintPulse:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: CocoaMQTT
      - target: PrintPulseWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRINTPULSE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PrintPulse
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: PrintPulse Settings
            CFBundleURLSchemes: [printpulse]
        SharedAppGroup: group.$(PRINTPULSE_BUNDLE_ID)
        SharedKeychainGroup: $(AppIdentifierPrefix)$(PRINTPULSE_BUNDLE_ID)
    entitlements:
      path: App/PrintPulse.entitlements
      properties:
        com.apple.security.application-groups: [group.$(PRINTPULSE_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRINTPULSE_BUNDLE_ID)]
  PrintPulseWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: CocoaMQTT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRINTPULSE_BUNDLE_ID).widget
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PrintPulse Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SharedAppGroup: group.$(PRINTPULSE_BUNDLE_ID)
        SharedKeychainGroup: $(AppIdentifierPrefix)$(PRINTPULSE_BUNDLE_ID)
    entitlements:
      path: Widget/PrintPulseWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(PRINTPULSE_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRINTPULSE_BUNDLE_ID)]
  PrintPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PrintPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRINTPULSE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PrintPulse:
    build:
      targets:
        PrintPulse: all
        PrintPulseTests: [test]
    test:
      targets: [PrintPulseTests]
      gatherCoverageData: true
